<!DOCTYPE html>0
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us- number, email.</title>
    <meta name="description" content="this is a page focus on contact to the rafting company.">
    <meta name="Madison Gardner" content="Madison Gardner">
    <link rel="stylesheet" href="styles/raftingcopy.css">
</head>

<body>
    <header class="main-header">
        <div class="main-logo">
            <img src="images/z-rapids-trees.jpg" alt="logo">
        </div>

        <nav class="main-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>


    </header>
    <main class="main-container">
        <section class="company-heading">
            <h1>Rapid Rafting Company</h1>
            <p>123 Main river street<br>
                Smithfield, Utah<br>
                +1 999 999 9999<br>
                info@whitewater.com</p>

        </section>


        <div class="contact-grid">

            <section class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2893895.381174745!2d-117.93781307708069!3d44.90157775180037!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5358158fba1f72dd%3A0xb0a9f6599feec377!2sSalmon%20River!5e0!3m2!1sen!2sus!4v1791629289718!5m2!1sen!2sus"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>

            <section class="form-box">
                <form action="phone-#" method="post">

                    <div class="form-group">
                        <label for="email">email</label>
                        <input type="email" id="email" name="email" placeholder="placeholder">
                    </div>

                    <div class="form-group radio-group">
                        <label>Message purpose</label>
                        <div class="radio-options">
                            <label><input type="radio" name="purpose" value="general" checked>
                                General Inquiry</label>
                            <label><input type="radio" name="purpose" value="reservation">
                                Resertvation question</label>
                            <label><input type="radio" name="purpose" value="website suggestion">
                                Website suggestion</label>
                        </div>

                    </div>

                    <div class="form-group">
                        <label for="Message">Message</label>
                        <textarea id="Message" name="message" placeholder="Type here"></textarea>
                    </div>


                    <div class=" form-group with-checkbox">
                        <label>
                            <input type="checkbox" name="newsletter" checked> Please subscribe me to
                            monthly newsletter
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </section>
        </div>

        <section class="Services-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-card">
                <img src="images/emp1.jpeg" alt="employee photo" class="photo">
                <p>Employee profile</p>
            </div>
            <div class="employee-card">
                <img src="images/emp22.jpeg" alt="employee photo" class="photo">
                <p>Employee profile</p>
            </div>
            <div class="employee-card">
                <img src="images/emp33.jpeg" alt="employee photo" class="photo">
                <p>Employee profile</p>
            </div>
        </section>


    </main>


    <footer>
        <p>&copy;2026 Rapid Rafting, 🌻 Madison Gardner 🌻</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook3.jpeg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin3.jpeg" alt="Linkedin Icon">

            </a>
            <a href="https://instagram.com">
                <img src="images/instagram3.jpeg" alt=" instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
